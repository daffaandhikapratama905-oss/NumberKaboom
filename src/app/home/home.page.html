<ion-content [fullscreen]="true">
  <div class="home-wrapper">
    
    <div class="logo-container">
      <div class="icon-circle">
        <ion-icon name="game-controller"></ion-icon>  
      </div>
      <h1>Number Kaboom</h1>
      <p>Strategi dan Logika dalam Setiap Kotak</p>
    </div>

    <div class="menu-actions">
      <button class="btn-play" routerLink="/game">
        <ion-icon name="play"></ion-icon>
        Mulai Bermain
      </button>

      <button class="btn-info" id="open-modal-guide">
        <ion-icon name="help-circle-outline"></ion-icon>
        Cara Bermain
      </button>

      <button class="btn-exit" (click)="exitApp()">
        <ion-icon name="log-out-outline"></ion-icon>
        Keluar Aplikasi
      </button>
    </div>

    <ion-modal trigger="open-modal-guide" #modal>
      <ng-template>
        <div class="modal-box">
          <div class="modal-header">
            <h2>Panduan</h2>
            <ion-icon name="close-circle" (click)="modal.dismiss()"></ion-icon>
          </div>
          <div class="instruction-content">
            <p><strong>Tujuan:</strong> Buka semua kotak tanpa meledakkan bom.</p>
          </div>
          <ul class="guide-list">
            <li><strong>Gali:</strong> Klik untuk membuka kotak.</li>
            <li><strong>Bendera:</strong> Tandai kotak yang dicurigai bom.</li>
          </ul>
          <button class="btn-close-modal" (click)="modal.dismiss()">
            Saya Mengerti
          </button>
        </div>
      </ng-template>
    </ion-modal>
  </div>
</ion-content>
